<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="445" viewBox="0 0 1280 445" role="img" aria-label="Naram Charan. I teach machines to predict things. AI and machine learning engineer. naramcharan.me."><title>Naram Charan. I teach machines to predict things. AI and machine learning engineer. naramcharan.me.</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#28515e" stroke-opacity=".22"/></pattern><radialGradient id="wash"><stop stop-color="#184853" stop-opacity=".45"/><stop offset="1" stop-color="#060b11" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="445" rx="12" fill="#060b11"/><rect width="1280" height="445" rx="12" fill="url(#grid)"/><rect x=".75" y=".75" width="1278.5" height="443.5" rx="11" fill="none" stroke="#22414e"/><ellipse cx="990" cy="235" rx="300" ry="225" fill="url(#wash)"/><path d="M34 68H1246M34 384H1246" stroke="#23434e"/><path d="M34 68H190M1110 384H1246" stroke="#73dcea" stroke-width="2"/><text x="38" y="42" fill="#73dcea" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="1.3">NC / PERSONAL ENGINEERING LOG</text><text x="1035" y="42" fill="#ffbd62" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="1.3">SYSTEMS ONLINE</text><circle cx="1018" cy="37" r="4" fill="#ffbd62"/><text x="52" y="109" fill="#73dcea" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">AI + MACHINE LEARNING</text><text x="48" y="189" fill="#ecf9fb" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-2">Naram Charan</text><text x="52" y="236" fill="#bcd7df" font-family="Arial,Helvetica,sans-serif" font-size="27" >I teach machines to predict things.</text><text x="52" y="288" fill="#73dcea" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">COMPUTER VISION  /  FORECASTING  /  NLP</text><path d="M53 315H696" stroke="#294e5b"/><text x="52" y="347" fill="#ecf9fb" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">MODEL</text><text x="187" y="347" fill="#ecf9fb" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">EVALUATE</text><text x="354" y="347" fill="#ecf9fb" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">SERVE</text><text x="493" y="347" fill="#ecf9fb" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">DEPLOY</text><path d="M119 342h42m-6-4 6 4-6 4M281 342h47m-6-4 6 4-6 4M419 342h48m-6-4 6 4-6 4" fill="none" stroke="#ffbd62"/><svg x="836" y="61" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="365" height="365" role="img" aria-label="Arc reactor, rotating">
  <title>ARC REACTOR — ONLINE</title>

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bdf3fb"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#halo)"/>

  <!-- weathered outer rim -->
  <circle cx="100" cy="100" r="86" fill="#0b1420" stroke="#59626b" stroke-width="7"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.35"/>

  <!-- ball-bearing rivets -->
  <g fill="#cdd9de">
    <circle cx="100" cy="14" r="3.4"/><circle cx="143" cy="26" r="3.4"/>
    <circle cx="174" cy="57" r="3.4"/><circle cx="186" cy="100" r="3.4"/>
    <circle cx="174" cy="143" r="3.4"/><circle cx="143" cy="174" r="3.4"/>
    <circle cx="100" cy="186" r="3.4"/><circle cx="57" cy="174" r="3.4"/>
    <circle cx="26" cy="143" r="3.4"/><circle cx="14" cy="100" r="3.4"/>
    <circle cx="26" cy="57" r="3.4"/><circle cx="57" cy="26" r="3.4"/>
  </g>

  <!-- tick ring, slowly rotating -->
  <g stroke="#22d3ee" stroke-width="1.4" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="26s" repeatCount="indefinite"/>
    <circle cx="100" cy="100" r="74" fill="none" stroke-dasharray="3 7"/>
  </g>

  <!-- coil well -->
  <circle cx="100" cy="100" r="66" fill="#08161f" stroke="#155e6b" stroke-width="2"/>

  <!-- brass windings + glow slots, counter-rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="34s" repeatCount="indefinite"/>
    <g>
      <!-- 10 winding blocks -->
      <g fill="#d8973c" opacity="0.85" stroke="#8a5a1c" stroke-width="0.8">
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(0 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(36 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(72 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(108 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(144 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(180 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(216 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(252 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(288 100 100)"/>
        <rect x="94" y="40" width="12" height="24" rx="2" transform="rotate(324 100 100)"/>
      </g>
      <!-- light spilling from between them -->
      <g stroke="#bdf3fb" stroke-width="3.4" stroke-linecap="round" opacity="0.9">
        <path d="M100 44 V64" transform="rotate(18 100 100)"/>
        <path d="M100 44 V64" transform="rotate(54 100 100)"/>
        <path d="M100 44 V64" transform="rotate(90 100 100)"/>
        <path d="M100 44 V64" transform="rotate(126 100 100)"/>
        <path d="M100 44 V64" transform="rotate(162 100 100)"/>
        <path d="M100 44 V64" transform="rotate(198 100 100)"/>
        <path d="M100 44 V64" transform="rotate(234 100 100)"/>
        <path d="M100 44 V64" transform="rotate(270 100 100)"/>
        <path d="M100 44 V64" transform="rotate(306 100 100)"/>
        <path d="M100 44 V64" transform="rotate(342 100 100)"/>
      </g>
    </g>
  </g>

  <!-- machined rings -->
  <circle cx="100" cy="100" r="34" fill="#0b1420" stroke="#2a4a55" stroke-width="2"/>
  <circle cx="100" cy="100" r="29" fill="none" stroke="#7de7f5" stroke-width="1" opacity="0.5"/>

  <!-- the triangle heart -->
  <circle cx="100" cy="100" r="24" fill="url(#core)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <path d="M100 86 L112 108 L88 108 Z" fill="#05080f" opacity="0.55"/>
  <path d="M100 86 L112 108 L88 108 Z" fill="none" stroke="#eafdff" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
<text x="38" y="415" fill="#ffbd62" font-family="Menlo,Consolas,monospace" font-size="13" letter-spacing="1.3">NARAMCHARAN.ME  →</text><text x="835" y="415" fill="#9aafb9" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.3">INSPIRED BY THE INTELLIGENCE BEHIND THE ARMOR</text></svg>